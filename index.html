<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>In the Zone</title>
<meta name="description" content="A two-minute anonymous team check on safety, influence and standards.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Jost:wght@400..700&display=swap" rel="stylesheet">
<style>
:root {
  --page: #000000;
  --page-ink: #FFFFFF;
  --page-soft: #BDBDBD;
  --bg: #F4F4F4;
  --surface: #FFFFFF;
  --ink: #000000;
  --ink-soft: #6F6767;
  --line: #E5E5E5;
  --line-strong: #CFCFCF;
  --grey-btn: #DCDCDC;
  --learning: #0E7C6B;
  --comfort: #4F7FAE;
  --anxiety: #C98A0B;
  --apathy: #7F7590;
  --danger: #C4271D;
  --field-learning: rgba(14,124,107,.10);
  --field-comfort: rgba(79,127,174,.09);
  --field-anxiety: rgba(201,138,11,.10);
  --field-apathy: rgba(127,117,144,.10);
  --display: "Jost", "Futura", "Century Gothic", "Trebuchet MS", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1E1E1E;
    --surface: #141414;
    --ink: #F2F2F2;
    --ink-soft: #A8A1A1;
    --line: #2C2C2C;
    --line-strong: #3D3D3D;
    --grey-btn: #2E2E2E;
    --learning: #3FBFA6;
    --comfort: #7FA9D6;
    --anxiety: #E6B447;
    --apathy: #AFA5C2;
    --danger: #F2837A;
    --field-learning: rgba(63,191,166,.12);
    --field-comfort: rgba(127,169,214,.11);
    --field-anxiety: rgba(230,180,71,.11);
    --field-apathy: rgba(175,165,194,.11);
  }
  .zone-hero { color: #0E1520 !important; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--page); }
body {
  margin: 0;
  background: var(--page);
  color: var(--page-ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
a { color: inherit; }
.wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }

/* Everything on a white block reads in black */
.panel, .note, .stat, .callout, .demo { color: var(--ink); }

.brandbar {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 20px 0 10px; font-size: 13px; color: var(--page-soft);
  border-bottom: 1px solid #262626;
}
.brandbar b { color: var(--page-ink); font-weight: 600; }
.demo {
  background: var(--surface); font-size: 13px;
  padding: 10px 14px; margin: 12px 0 0;
}
.demo button { font: inherit; color: inherit; background: none; border: 0; padding: 0 0 1px; margin-right: 12px; text-decoration: underline; cursor: pointer; }
main { padding: 32px 0 64px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; }
.wordmark {
  font-family: var(--display); font-weight: 600; font-size: clamp(50px, 12.5vw, 88px);
  letter-spacing: -0.01em; line-height: .95; margin: 8px 0 20px;
}
h1.page { font-size: clamp(28px, 6.5vw, 40px); font-weight: 600; letter-spacing: 0; margin-bottom: 12px; }
h2 { font-size: 17px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
h3 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
p { margin: 0 0 14px; }
.lede { font-size: 18px; color: var(--page-soft); max-width: 34em; }
.muted { color: var(--page-soft); }
.panel .muted, .note .muted, .stat .muted, .callout .muted { color: var(--ink-soft); }
.small { font-size: 14px; }
section { margin-top: 32px; }
.panel {
  background: var(--surface); border-radius: 0;
  padding: 26px 22px;
}
.panel + .panel { margin-top: 16px; }
.steps { list-style: none; padding: 0; margin: 0; counter-reset: s; }
.steps li { counter-increment: s; position: relative; padding: 0 0 16px 42px; color: var(--page-soft); }
.steps li b { color: var(--page-ink); font-weight: 600; }
.steps li::before {
  content: counter(s); position: absolute; left: 0; top: 0;
  width: 26px; height: 26px; background: var(--page-ink); color: var(--page);
  display: grid; place-items: center; font-family: var(--display); font-weight: 600; font-size: 14px;
}
label.field, .field { display: block; font-weight: 600; font-size: 15px; margin-bottom: 6px; }
.hint { font-size: 14px; color: var(--ink-soft); margin: -2px 0 10px; }
input[type=text], input[type=password] {
  width: 100%; font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 0; padding: 12px 13px;
}
input[type=text]:focus, input[type=password]:focus { border-color: var(--ink); outline: none; box-shadow: inset 0 0 0 1px var(--ink); }
:focus-visible { outline: 2px solid var(--learning); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); }
.seg label {
  min-width: 76px; text-align: center; cursor: pointer; padding: 9px 16px;
  font-family: var(--display); font-weight: 500; font-size: 14px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-soft); border-left: 1px solid var(--line-strong);
}
.seg label:first-child { border-left: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--ink); color: var(--surface); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--learning); outline-offset: 2px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .1em; text-transform: uppercase;
  cursor: pointer; text-decoration: none; border-radius: 0; padding: 14px 24px;
  border: 1px solid var(--ink); background: var(--ink); color: var(--surface);
}
.btn:hover { opacity: .85; }
.btn.secondary { background: var(--grey-btn); color: var(--ink); border-color: var(--grey-btn); }
.btn.secondary:hover { opacity: 1; background: var(--line-strong); border-color: var(--line-strong); }
.btn.small { padding: 8px 14px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: progress; }
main > .actions .btn { background: var(--page-ink); color: var(--page); border-color: var(--page-ink); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.linkbox { display: flex; gap: 8px; align-items: stretch; margin: 8px 0; }
.linkbox code {
  flex: 1; min-width: 0; overflow-wrap: anywhere; font-family: var(--body); font-size: 13px;
  background: var(--bg); padding: 9px 12px; color: var(--ink-soft);
}
textarea {
  width: 100%; font: inherit; font-size: 14px; color: var(--ink); background: var(--bg);
  border: 0; border-radius: 0; padding: 12px; min-height: 150px; resize: vertical;
}
.error { color: var(--danger); font-weight: 600; font-size: 15px; margin-top: 12px; }
.note { background: var(--surface); padding: 18px 20px; font-size: 14px; margin: 20px 0; }
.note b { font-weight: 600; }
.note p { color: var(--ink-soft); }
.q { padding: 28px 0; border-top: 1px solid var(--line); }
.q:first-of-type { border-top: 0; padding-top: 6px; }
.q.missing .qtext { color: var(--danger); }
.qtext { font-weight: 500; font-size: 16px; margin-bottom: 14px; display: flex; gap: 12px; }
.qnum { font-family: var(--display); color: var(--ink-soft); min-width: 1.1em; font-weight: 500; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.scale label {
  border: 1px solid var(--line-strong); text-align: center; cursor: pointer;
  padding: 9px 3px 8px; color: var(--ink-soft); background: var(--surface);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px;
}
.scale .n { font-family: var(--display); font-weight: 600; font-size: 17px; line-height: 1.1; }
.scale .w { font-size: 10.5px; line-height: 1.2; letter-spacing: .01em; }
@media (min-width: 520px) { .scale .w { font-size: 12px; } }
.scale label:hover { border-color: var(--ink); color: var(--ink); }
.scale input { position: absolute; opacity: 0; pointer-events: none; }
.scale label:has(input:checked) { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.scale label:has(input:focus-visible) { outline: 2px solid var(--learning); outline-offset: 2px; }
.zone-hero { padding: 26px 22px; color: #fff; }
.zone-hero .k { font-family: var(--display); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; opacity: .9; }
.zone-hero h2 { font-size: clamp(30px, 8vw, 44px); font-weight: 600; letter-spacing: .04em; margin: 4px 0 10px; }
.zone-hero p { margin: 0; max-width: 34em; font-size: 15px; }
.chart svg { width: 100%; max-width: 440px; height: auto; display: block; margin: 4px auto 0; }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; font-size: 13px; color: var(--ink-soft); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.gap-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 14px; }
.gap-table th, .gap-table td { text-align: left; padding: 10px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.gap-table thead th { color: var(--ink-soft); font-weight: 500; font-size: 13px; border-top: 0; }
.gap-table th { font-weight: 600; }
.gap-table td.num { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bars { margin: 6px 0 0; }
.bar { margin: 16px 0; }
.bar .lbl { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.bar .lbl b { font-weight: 600; font-variant-numeric: tabular-nums; }
.bar .track { position: relative; height: 8px; background: var(--bg); margin-top: 7px; }
.bar .fill { height: 100%; background: var(--ink); }
.bar .pm { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid var(--ink); background: var(--surface); }
.bar .gapnote { font-size: 12.5px; color: var(--ink-soft); margin-top: 5px; }
.group-h { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; margin: 26px 0 0; color: var(--ink-soft); }
.callout { background: var(--bg); padding: 12px 14px; font-size: 14px; margin-top: 12px; }
ol.qs { padding-left: 20px; margin: 0; }
ol.qs li { margin: 8px 0; padding-left: 4px; }
.progress { height: 8px; background: var(--bg); overflow: hidden; margin: 14px 0; }
.progress div { height: 100%; background: var(--learning); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); padding: 14px; }
.stat b { display: block; font-family: var(--display); font-size: 28px; font-weight: 600; line-height: 1.1; }
.stat span { font-size: 13px; color: var(--ink-soft); }
.tablewrap { overflow-x: auto; margin-top: 10px; }
table.teams { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 560px; }
table.teams th, table.teams td { text-align: left; padding: 10px 8px; border-top: 1px solid var(--line); }
table.teams thead th { font-weight: 500; color: var(--ink-soft); font-size: 13px; border-top: 0; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.toggle input { width: 16px; height: 16px; accent-color: var(--ink); }
.center { text-align: center; }
.spinner { padding: 60px 0; text-align: center; color: var(--page-soft); }
footer { padding: 20px 0 40px; font-size: 12px; color: var(--page-soft); border-top: 1px solid #262626; }
@media (prefers-reduced-motion: no-preference) {
  .reveal { animation: rise .4s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandbar"><span><b>Run to the Monster</b> in partnership with <b id="partner">WFS</b></span></div>
  <div id="demo"></div>
  <main id="app" aria-live="polite"><div class="spinner">Loading</div></main>
  <footer>In the Zone is a Run to the Monster tool. Team check responses are anonymous.</footer>
</div>
<script>
/* ======================================================================
   CONFIG: the only part you need to edit
   ====================================================================== */
const CONFIG = {
  // Paste the Google Apps Script web app URL here. Leave empty for demo mode.
  API_URL: "https://script.google.com/macros/s/AKfycbw4pOU3f2TL5Tp7ez5V8J_kxW-kh_xBagYMmS89L4G42rG2gJW86_NujGLOn_gnGf9C/exec",
  // Optional: the public address of this page, e.g. "https://runtothemonster.github.io/in-the-zone/"
  // Leave empty to use the address the page is opened from.
  SITE_URL: "",
  // Partner name shown in the header
  PARTNER: "WFS"
};

/* ====================================================================== */

const QUESTIONS = [
  { text: "I feel safe to speak up, disagree or admit a mistake in this team.", lead: "People feel safe to speak up, disagree or admit a mistake in this team.", short: "Safe to speak up", dim: "safety" },
  { text: "I can be myself here without having to tone down who I am.", lead: "People can be themselves here without having to tone down who they are.", short: "Can be myself", dim: "safety" },
  { text: "I have real influence over decisions that affect my work.", lead: "People have real influence over decisions that affect their work.", short: "Influence over decisions", dim: "power" },
  { text: "When I raise an idea or concern, it is taken seriously and acted on.", lead: "When people raise an idea or concern, it is taken seriously and acted on.", short: "Ideas taken seriously", dim: "power" },
  { text: "I know exactly what's expected of me and what good looks like.", lead: "People know exactly what's expected of them and what good looks like.", short: "Clarity", dim: "accountability" },
  { text: "When work falls short, it gets noticed and addressed.", lead: "When work falls short, it gets noticed and addressed.", short: "Follow-through", dim: "accountability" },
  { text: "I'm challenged to grow, not just to get through the work.", lead: "People are challenged to grow, not just to get through the work.", short: "Stretch", dim: "accountability" },
  { text: "The same bar applies to everyone in this team.", lead: "The same bar applies to everyone in this team.", short: "Fairness", dim: "accountability" }
];
const SCALE_WORDS = ["Strongly disagree", "Disagree", "Neutral", "Agree", "Strongly agree"];
const DIMS = { safety: "Safety", power: "Influence", accountability: "Standards" };

const ZONES = {
  learning: {
    name: "Learning zone", color: "var(--learning)",
    text: "People feel safe to speak up and are held to a high bar. This is where learning and high performance happen. The work now is keeping it here when pressure rises."
  },
  comfort: {
    name: "Comfort zone", color: "var(--comfort)",
    text: "People feel safe, but the bar isn't clear or consistently held. It's a warm team that isn't being stretched. The move is to raise the bar: make expectations explicit and follow through."
  },
  anxiety: {
    name: "Anxiety zone", color: "var(--anxiety)",
    text: "The bar is high, but people don't feel safe to speak, ask for help or admit mistakes, so problems stay hidden. The move is to lower the cost of speaking up: ask before telling, thank people for bad news and treat mistakes as information."
  },
  apathy: {
    name: "Apathy zone", color: "var(--apathy)",
    text: "Safety is low and the bar is low. People protect themselves rather than invest in the work. The move is to start with trust and relationships, then rebuild purpose and standards."
  }
};

const REFLECT = [
  "What surprised you, and what didn't?",
  "Which zone is your team in? Is that where you'd have placed it?",
  "Who is outside the cluster on the power and safety graph? What might they be carrying that you don't see?",
  "Which standards statement scored lowest? What does that say about clarity, follow-through, stretch or fairness in your team?",
  "What's one thing in your control that would move your team one step towards the learning zone?"
];
const TEAM_QS = [
  "Here's what you told me. Does it look right to you?",
  "What's one thing that would make it easier to speak up in this team?",
  "What's one thing I should start, stop or continue?"
];

/* ---------- utilities ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mean = xs => xs.reduce((a, b) => a + b, 0) / xs.length;
const r2 = x => Math.round(x * 100) / 100;
const fmt = x => (Math.round(x * 10) / 10).toFixed(1);
const store = {
  get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }
};

function zoneOf(safety, acc) {
  if (safety >= 3 && acc >= 3) return "learning";
  if (safety >= 3) return "comfort";
  if (acc >= 3) return "anxiety";
  return "apathy";
}
function nearLine(safety, acc) { return Math.abs(safety - 3) < 0.3 || Math.abs(acc - 3) < 0.3; }

function baseUrl() {
  if (CONFIG.SITE_URL) return CONFIG.SITE_URL.replace(/[?#].*$/, "");
  return location.href.replace(/[?#].*$/, "");
}
const surveyLink = code => baseUrl() + "?t=" + encodeURIComponent(code);
const resultsLink = (code, key) => baseUrl() + "?t=" + encodeURIComponent(code) + "&k=" + encodeURIComponent(key);

async function copyText(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
    ta.remove();
  }
  if (btn) {
    const old = btn.textContent;
    btn.textContent = ok ? "Copied" : "Select and copy";
    setTimeout(() => { btn.textContent = old; }, 1800);
  }
}

function summarise(answers) {
  const points = answers.map(a => ({ safety: mean([a[0], a[1]]), power: mean([a[2], a[3]]) }));
  for (let i = points.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [points[i], points[j]] = [points[j], points[i]]; }
  return {
    points,
    itemAverages: [0, 1, 2, 3, 4, 5, 6, 7].map(i => r2(mean(answers.map(a => a[i])))),
    averages: {
      safety: r2(mean(answers.map(a => mean([a[0], a[1]])))),
      power: r2(mean(answers.map(a => mean([a[2], a[3]])))),
      accountability: r2(mean(answers.map(a => mean([a[4], a[5], a[6], a[7]]))))
    }
  };
}

function predFromItems(items) {
  return {
    items,
    safety: r2(mean([items[0], items[1]])),
    power: r2(mean([items[2], items[3]])),
    accountability: r2(mean([items[4], items[5], items[6], items[7]]))
  };
}
const validAnswers = a => Array.isArray(a) && a.length === 8 && a.every(v => Number.isInteger(v) && v >= 1 && v <= 5);

/* ---------- API (real or demo) ---------- */
const DEMO = !CONFIG.API_URL;
const MOCK = {
  min: 4,
  password: "demo",
  teams: {
    DEMO01: { key: "demo", name: "Credit Risk Analytics", level: "W2", prediction: predFromItems([4,5,4,3,4,3,4,5]),
      responses: [[4,4,4,4,4,3,4,3],[5,4,4,5,4,4,4,4],[4,3,3,3,4,3,3,3],[2,2,2,1,3,3,2,2],[4,4,3,4,5,4,4,3],[3,2,2,2,4,3,3,2],[5,5,4,4,4,4,5,4],[4,4,4,3,4,4,4,4],[2,1,2,2,3,2,3,1]] },
    DEMO02: { key: "demo2", name: "Collections Strategy", level: "W3", prediction: predFromItems([4,3,3,3,5,4,4,5]),
      responses: [[2,3,2,2,5,4,4,4],[2,2,3,2,4,5,4,3],[3,2,2,3,5,4,4,4],[2,2,2,2,4,4,3,3],[1,2,2,1,5,5,4,4],[3,3,3,3,4,4,4,4],[2,2,2,2,4,4,4,3]] },
    DEMO03: { key: "demo3", name: "Customer Insights", level: "W3", prediction: predFromItems([4,4,4,4,4,3,3,4]),
      responses: [[4,4,3,3,3,3,3,3],[3,3,3,3,4,3,3,3]] },
    DEMO04: { key: "demo4", name: "Card Operations", level: "W2", prediction: predFromItems([5,4,4,4,4,4,4,4]),
      responses: [[4,4,3,4,2,2,3,3],[5,4,4,4,3,2,2,3],[4,5,3,3,2,2,2,2],[4,4,4,4,3,2,3,3],[5,5,4,4,2,3,2,3]] }
  },
  created: {}
};

const mock = {
  createTeam(p) {
    if (!p.name || !p.level || !validAnswers(p.predItems)) return { ok: false, error: "invalid" };
    const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
    let code; do { code = Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join(""); } while (MOCK.teams[code]);
    const key = Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 12);
    MOCK.teams[code] = { key, name: p.name, level: p.level, prediction: predFromItems(p.predItems.slice()), responses: [] };
    return { ok: true, code, key };
  },
  getTeam(p) {
    const t = MOCK.teams[String(p.code || "").toUpperCase()];
    return t ? { ok: true, name: t.name, level: t.level } : { ok: false, error: "not_found" };
  },
  submit(p) {
    const t = MOCK.teams[String(p.code || "").toUpperCase()];
    if (!t) return { ok: false, error: "not_found" };
    if (!validAnswers(p.answers)) return { ok: false, error: "invalid" };
    t.responses.push(p.answers.slice());
    return { ok: true };
  },
  results(p) {
    const code = String(p.code || "").toUpperCase(), t = MOCK.teams[code];
    if (!t || p.key !== t.key) return { ok: false, error: "not_found" };
    const out = { ok: true, name: t.name, level: t.level, n: t.responses.length, min: MOCK.min, prediction: t.prediction, locked: t.responses.length < MOCK.min };
    if (!out.locked) Object.assign(out, summarise(t.responses));
    return out;
  },
  admin(p) {
    if (p.password !== MOCK.password) return { ok: false, error: "denied" };
    const all = [];
    const teams = Object.entries(MOCK.teams).map(([code, t]) => {
      const unlocked = t.responses.length >= MOCK.min;
      if (unlocked) all.push(...t.responses);
      return { code, key: t.key, name: t.name, level: t.level, n: t.responses.length, prediction: t.prediction, averages: unlocked ? summarise(t.responses).averages : null };
    });
    const s = all.length ? summarise(all) : null;
    return { ok: true, min: MOCK.min, teams, cohort: s && s.averages, cohortItems: s && s.itemAverages, cohortN: all.length };
  }
};

async function api(action, payload) {
  if (DEMO) {
    await new Promise(r => setTimeout(r, 250));
    return mock[action](payload || {});
  }
  const res = await fetch(CONFIG.API_URL, {
    method: "POST",
    body: JSON.stringify(Object.assign({ action }, payload || {}))
  });
  if (!res.ok) throw new Error("network");
  return res.json();
}

/* ---------- routing ---------- */
let params = new URLSearchParams(location.search);
function go(query) {
  params = new URLSearchParams(query);
  try { history.pushState(null, "", query ? "?" + query : location.pathname); } catch (e) { /* sandboxed preview */ }
  route();
  window.scrollTo(0, 0);
}
window.addEventListener("popstate", () => { params = new URLSearchParams(location.search); route(); });

function route() {
  if (params.has("admin")) return viewAdmin();
  const t = params.get("t"), k = params.get("k");
  if (t && k) return viewResults(t, k);
  if (t) return viewSurvey(t);
  return viewStart();
}
const app = () => $("#app");
function render(html) { app().innerHTML = html; }
function fail(msg) {
  render(`<div class="panel reveal"><h1 class="page">Something went wrong</h1><p>${esc(msg)}</p><div class="actions"><button class="btn secondary" onclick="route()">Try again</button></div></div>`);
}

/* ---------- charts ---------- */
function chart(o) {
  const S = 360, L = 46, B = 46, T = 14, R = 14, W = S - L - R, H = S - T - B;
  const x = v => L + (v - 1) / 4 * W;
  const y = v => T + (1 - (v - 1) / 4) * H;
  let g = "";
  if (o.zones) {
    g += `<rect x="${L}" y="${T}" width="${W / 2}" height="${H / 2}" fill="var(--field-comfort)"/>`;
    g += `<rect x="${L + W / 2}" y="${T}" width="${W / 2}" height="${H / 2}" fill="var(--field-learning)"/>`;
    g += `<rect x="${L}" y="${T + H / 2}" width="${W / 2}" height="${H / 2}" fill="var(--field-apathy)"/>`;
    g += `<rect x="${L + W / 2}" y="${T + H / 2}" width="${W / 2}" height="${H / 2}" fill="var(--field-anxiety)"/>`;
    const zl = (tx, ty, anchor, name, col) => `<text x="${tx}" y="${ty}" text-anchor="${anchor}" fill="${col}" font-family="var(--display)" font-weight="700" font-size="14">${name}</text>`;
    g += zl(L + 10, T + 22, "start", "Comfort", "var(--comfort)");
    g += zl(L + W - 10, T + 22, "end", "Learning", "var(--learning)");
    g += zl(L + 10, T + H - 12, "start", "Apathy", "var(--apathy)");
    g += zl(L + W - 10, T + H - 12, "end", "Anxiety", "var(--anxiety)");
  }
  g += `<line x1="${x(3)}" y1="${T}" x2="${x(3)}" y2="${T + H}" stroke="var(--ink-soft)" stroke-dasharray="4 5" stroke-width="1.2"/>`;
  g += `<line x1="${L}" y1="${y(3)}" x2="${L + W}" y2="${y(3)}" stroke="var(--ink-soft)" stroke-dasharray="4 5" stroke-width="1.2"/>`;
  g += `<line x1="${L}" y1="${T}" x2="${L}" y2="${T + H}" stroke="var(--ink)" stroke-width="2"/>`;
  g += `<line x1="${L}" y1="${T + H}" x2="${L + W}" y2="${T + H}" stroke="var(--ink)" stroke-width="2"/>`;
  const ax = (tx, ty, anchor, txt, extra = "") => `<text x="${tx}" y="${ty}" text-anchor="${anchor}" fill="var(--ink-soft)" font-family="var(--body)" font-size="12.5" ${extra}>${esc(txt)}</text>`;
  g += ax(L, T + H + 20, "start", o.xLow);
  g += ax(L + W, T + H + 20, "end", o.xHigh);
  g += `<text x="${L + W / 2}" y="${T + H + 38}" text-anchor="middle" fill="var(--ink)" font-family="var(--display)" font-weight="700" font-size="14">${esc(o.xTitle)}</text>`;
  g += `<text transform="translate(${L - 10} ${T + H}) rotate(-90)" text-anchor="start" fill="var(--ink-soft)" font-family="var(--body)" font-size="12.5">${esc(o.yLow)}</text>`;
  g += `<text transform="translate(${L - 10} ${T}) rotate(-90)" text-anchor="end" fill="var(--ink-soft)" font-family="var(--body)" font-size="12.5">${esc(o.yHigh)}</text>`;
  g += `<text transform="translate(${L - 28} ${T + H / 2}) rotate(-90)" text-anchor="middle" fill="var(--ink)" font-family="var(--display)" font-weight="700" font-size="14">${esc(o.yTitle)}</text>`;

  // individual dots, spread where they overlap
  if (o.dots && o.dots.length) {
    const seen = {};
    o.dots.forEach(d => {
      const key = d.x + "," + d.y, k = seen[key] = (seen[key] || 0) + 1;
      const ang = (k - 1) * 2.4, rad = k === 1 ? 0 : 7 + (k - 2) * 1.6;
      g += `<circle cx="${x(d.x) + Math.cos(ang) * rad}" cy="${y(d.y) + Math.sin(ang) * rad}" r="6.5" fill="var(--ink)" fill-opacity=".72" stroke="var(--surface)" stroke-width="1.5"/>`;
    });
  }
  // team dots (admin)
  if (o.teams) {
    o.teams.forEach(t => {
      const cx = x(t.x), cy = y(t.y);
      if (t.level === "W3") g += `<rect x="${cx - 7}" y="${cy - 7}" width="14" height="14" rx="2" fill="var(--ink)" stroke="var(--surface)" stroke-width="1.5"/>`;
      else g += `<circle cx="${cx}" cy="${cy}" r="8" fill="var(--ink)" stroke="var(--surface)" stroke-width="1.5"/>`;
      if (o.showLabels) {
        const right = cx > L + W * 0.55;
        g += `<text x="${right ? cx - 11 : cx + 11}" y="${cy + 4}" text-anchor="${right ? "end" : "start"}" fill="var(--ink)" font-family="var(--body)" font-size="11.5">${esc(t.label)}</text>`;
      }
    });
  }
  if (o.pred && o.avg) {
    g += `<line x1="${x(o.pred.x)}" y1="${y(o.pred.y)}" x2="${x(o.avg.x)}" y2="${y(o.avg.y)}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="2 4"/>`;
  }
  if (o.pred) g += `<circle cx="${x(o.pred.x)}" cy="${y(o.pred.y)}" r="11" fill="none" stroke="var(--ink)" stroke-width="3"/>`;
  if (o.avg) {
    g += `<circle cx="${x(o.avg.x)}" cy="${y(o.avg.y)}" r="12" fill="${o.avgColor || "var(--learning)"}" stroke="var(--surface)" stroke-width="3"/>`;
  }
  return svgVars(`<svg viewBox="0 0 ${S} ${S}" role="img" aria-label="${esc(o.aria || "")}">${g}</svg>`);
}

/* Moves var(--token) colours from SVG attributes into style, so theme colours apply everywhere. */
function svgVars(s) {
  return s.replace(/<(\w+)([^<>]*?)(\/?)>/g, (m, tag, attrs, sl) => {
    let st = "";
    attrs = attrs.replace(/\s(fill|stroke|font-family)="(var\([^"]*\))"/g, (mm, k, v) => { st += k + ":" + v + ";"; return ""; });
    return `<${tag}${attrs}${st ? ` style="${st}"` : ""}${sl}>`;
  });
}

function legend(items) {
  const icon = {
    avg: `<svg width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="var(--learning)"/></svg>`,
    pred: `<svg width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="var(--ink)" stroke-width="2.5"/></svg>`,
    dot: `<svg width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="var(--ink)" fill-opacity=".72"/></svg>`,
    w2: `<svg width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="var(--ink)"/></svg>`,
    w3: `<svg width="16" height="16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="2" fill="var(--ink)"/></svg>`
  };
  return `<div class="legend">${items.map(([k, t]) => `<span>${svgVars(icon[k])}${esc(t)}</span>`).join("")}</div>`;
}

/* Once a statement is answered, stop marking it as missing. */
function clearMissing(input) {
  const q = input.closest(".q");
  if (q) q.classList.remove("missing");
  const form = input.closest("form");
  if (form && !form.querySelector(".q.missing")) { const e = form.querySelector(".error"); if (e && /statement/.test(e.textContent)) e.hidden = true; }
}

/* One statement with a 1 to 5 scale. Used in the survey and the leader's prediction. */
function scaleQ(name, i, text) {
  return `<fieldset class="q" id="${name}-q" style="border:0;margin:0;padding-left:0;padding-right:0">
    <legend class="qtext" style="padding:0"><span class="qnum">${i + 1}</span><span>${esc(text)}</span></legend>
    <div class="scale">${[1, 2, 3, 4, 5].map(v => `<label><input type="radio" name="${name}" value="${v}" aria-label="${v}: ${SCALE_WORDS[v - 1]}"><span class="n">${v}</span><span class="w">${SCALE_WORDS[v - 1]}</span></label>`).join("")}</div>
  </fieldset>`;
}

/* ---------- views: results ---------- */
async function viewResults(code, key) {
  code = code.toUpperCase();
  render(`<div class="spinner">Loading your results</div>`);
  let r;
  try { r = await api("results", { code, key }); } catch (e) { return fail("Your results didn't load. Check your connection and try again."); }
  if (!r.ok) return render(`<div class="panel reveal"><h1 class="page">This results link isn't working</h1><p>Check you've copied the whole link. If you've lost it, ask your programme facilitator to resend it.</p></div>`);
  document.title = "Results: " + r.name;
  const sLink = surveyLink(code);
  const head = `<div class="reveal"><p class="muted" style="margin:0 0 4px">${esc(r.level)} team, ${r.n} ${r.n === 1 ? "response" : "responses"}</p><h1 class="page">${esc(r.name)}</h1></div>`;
  const collect = `<div class="panel"><h3>Keep collecting</h3><p class="small muted">Results update as more people respond. Share the survey link again if needed.</p>
    <div class="linkbox"><code>${esc(sLink)}</code><button class="btn small secondary" data-copy="${esc(sLink)}">Copy</button></div>
    <div class="actions"><button class="btn small secondary" id="refresh">Refresh results</button></div></div>`;

  if (r.locked) {
    const pct = Math.min(100, Math.round(r.n / r.min * 100));
    render(`${head}
      <div class="panel">
        <h2>${r.n} of ${r.min} responses so far</h2>
        <div class="progress" role="progressbar" aria-valuenow="${r.n}" aria-valuemin="0" aria-valuemax="${r.min}"><div style="width:${pct}%"></div></div>
        <p>Results unlock once ${r.min} people have responded. This protects everyone's anonymity.</p>
      </div>
      <div class="panel"><h3>Your prediction</h3><div class="chart" style="max-width:320px">${chart(Object.assign({}, EDM, { pred: { x: r.prediction.accountability, y: r.prediction.safety }, aria: "Your prediction" }))}</div>${legend([["pred", "Your prediction"]])}</div>
      ${collect}`);
    bindCopies();
    $("#refresh").addEventListener("click", () => viewResults(code, key));
    return;
  }

  const a = r.averages, p = r.prediction;
  const z = zoneOf(a.safety, a.accountability), Z = ZONES[z];
  const near = nearLine(a.safety, a.accountability);
  const gapRow = (label, pv, av) => {
    const d = av - pv;
    const say = Math.abs(d) < 0.25 ? "As expected" : (d < 0 ? "Lower than expected" : "Higher than expected");
    return `<tr><th>${label}</th><td class="num">${fmt(pv)}</td><td class="num">${fmt(av)}</td><td>${say}</td></tr>`;
  };
  const items = Array.isArray(p.items) && p.items.length === 8 ? p.items : null;
  const groups = ["safety", "power", "accountability"];
  const bars = groups.map(dim => `<p class="group-h">${DIMS[dim]}</p>` + QUESTIONS.map((q, i) => {
    if (q.dim !== dim) return "";
    const v = r.itemAverages[i], pv = items ? items[i] : null;
    const d = pv === null ? 0 : v - pv;
    const note = pv === null ? "" : `<div class="gapnote">You predicted ${pv}.${Math.abs(d) >= 0.75 ? (d < 0 ? " Your team rates this lower." : " Your team rates this higher.") : ""}</div>`;
    return `<div class="bar"><div class="lbl"><span>${esc(q.text)}</span><b>${fmt(v)}</b></div>
      <div class="track"><div class="fill" style="width:${(v - 1) / 4 * 100}%"></div>${pv === null ? "" : `<span class="pm" style="left:${(pv - 1) / 4 * 100}%" title="Your prediction"></span>`}</div>${note}</div>`;
  }).join("")).join("");
  const biggest = items ? QUESTIONS.map((q, i) => ({ q, v: r.itemAverages[i], pv: items[i], d: r.itemAverages[i] - items[i] })).sort((m, n) => Math.abs(n.d) - Math.abs(m.d))[0] : null;

  render(`${head}
  <div class="zone-hero reveal" style="background:${Z.color}">
    <div class="k">Your team reads as</div>
    <h2>${Z.name}</h2>
    <p>${near ? "It sits close to the line, so treat this as a direction rather than a verdict. " : ""}${esc(Z.text)}</p>
  </div>

  <section class="panel">
    <h2>Where your team sits</h2>
    <p class="muted small">Psychological safety against standards, after Amy Edmondson. The filled dot is your team's average. The ring is your prediction.</p>
    <div class="chart">${chart(Object.assign({}, EDM, { avg: { x: a.accountability, y: a.safety }, pred: { x: p.accountability, y: p.safety }, avgColor: Z.color, aria: "Team average on the zones graph" }))}</div>
    ${legend([["avg", "Team average"], ["pred", "Your prediction"]])}
    <table class="gap-table">
      <thead><tr><th></th><th>You predicted</th><th>Team says</th><th></th></tr></thead>
      <tbody>${gapRow("Safety", p.safety, a.safety)}${gapRow("Influence", p.power, a.power)}${gapRow("Standards", p.accountability, a.accountability)}</tbody>
    </table>
    <p class="small muted" style="margin-top:10px">Scores run from 1 to 5. The dashed lines sit at 3.</p>
  </section>

  <section class="panel">
    <h2>Who sits where</h2>
    <p class="muted small">Each dot is one person, placed by how safe they feel and how much influence they have. Look for anyone away from the cluster, especially towards the bottom left. The average hides them.</p>
    <div class="chart">${chart(Object.assign({}, PWR, { dots: r.points.map(pt => ({ x: pt.power, y: pt.safety })), avg: { x: a.power, y: a.safety }, pred: { x: p.power, y: p.safety }, avgColor: Z.color, aria: "Each person by power and safety" }))}</div>
    ${legend([["dot", "One person"], ["avg", "Team average"], ["pred", "Your prediction"]])}
  </section>

  <section class="panel">
    <h2>Statement by statement</h2>
    <p class="muted small">The bar is your team's average, from 1 (strongly disagree) to 5 (strongly agree).${items ? " The ring is your prediction." : ""}</p>
    ${biggest && Math.abs(biggest.d) >= 0.5 ? `<div class="callout"><b>Your biggest gap:</b> ${esc(biggest.q.short.toLowerCase())}. You predicted ${biggest.pv}; your team says ${fmt(biggest.v)}.</div>` : ""}
    <div class="bars">${bars}</div>
  </section>

  <section class="panel">
    <h2>Reflect before you talk to your team</h2>
    <ol class="qs">${REFLECT.map(q => `<li>${esc(q)}</li>`).join("")}</ol>
  </section>

  <section class="panel">
    <h2>Take it back to your team</h2>
    <p>Share what came back, then ask:</p>
    <ol class="qs">${TEAM_QS.map(q => `<li>${esc(q)}</li>`).join("")}</ol>
    <p class="small muted" style="margin-top:12px">Sharing results back shows your team their answers went somewhere. Skip it, and fewer people will answer next time.</p>
  </section>
  ${collect}`);
  bindCopies();
  $("#refresh").addEventListener("click", () => viewResults(code, key));
}

/* ---------- views: admin ---------- */
let adminPw = "";
function viewAdmin() {
  document.title = "In the Zone: admin";
  if (!adminPw) {
    render(`<form id="login" class="panel reveal" style="max-width:420px">
      <h1 class="page">Programme view</h1>
      <label class="field" for="pw">Admin password</label>
      <input type="password" id="pw" autocomplete="current-password">
      ${DEMO ? `<p class="hint" style="margin-top:8px">Demo password: demo</p>` : ""}
      <p class="error" id="aerr" hidden></p>
      <div class="actions"><button class="btn" type="submit">Open programme view</button></div>
    </form>`);
    $("#login").addEventListener("submit", async ev => {
      ev.preventDefault();
      adminPw = $("#pw").value;
      const ok = await loadAdmin();
      if (!ok) { adminPw = ""; const e = $("#aerr"); if (e) { e.hidden = false; e.textContent = "That password isn't right."; } }
    });
    return;
  }
  loadAdmin();
}

async function loadAdmin() {
  let d;
  try { d = await api("admin", { password: adminPw }); } catch (e) { fail("The programme view didn't load. Check your connection and try again."); return true; }
  if (!d.ok) return false;
  const unlocked = d.teams.filter(t => t.averages);
  const counts = { learning: 0, comfort: 0, anxiety: 0, apathy: 0 };
  unlocked.forEach(t => counts[zoneOf(t.averages.safety, t.averages.accountability)]++);
  const totalResp = d.teams.reduce((s, t) => s + t.n, 0);
  const rows = d.teams.slice().sort((m, n) => (n.n - m.n)).map(t => {
    const av = t.averages, zk = av && zoneOf(av.safety, av.accountability);
    return `<tr><td>${esc(t.name)}</td><td>${esc(t.level)}</td><td>${t.n}</td>
      <td>${av ? fmt(av.safety) : ""}</td><td>${av ? fmt(av.power) : ""}</td><td>${av ? fmt(av.accountability) : ""}</td>
      <td>${av ? `<span class="dot" style="background:${ZONES[zk].color}"></span> ${ZONES[zk].name.replace(" zone", "")}` : `<span class="muted">Waiting (${t.n}/${d.min})</span>`}</td>
      <td><button class="btn small secondary" data-copy="${esc(resultsLink(t.code, t.key))}">Copy results link</button></td></tr>`;
  }).join("");
  const cohortBars = d.cohortItems ? ["safety", "power", "accountability"].map(dim => `<p class="group-h">${DIMS[dim]}</p>` + QUESTIONS.map((q, i) => q.dim !== dim ? "" : `
      <div class="bar"><div class="lbl"><span>${esc(q.short)}</span><b>${fmt(d.cohortItems[i])}</b></div>
      <div class="track"><div class="fill" style="width:${(d.cohortItems[i] - 1) / 4 * 100}%"></div></div></div>`).join("")).join("") : `<p class="muted">No team has reached ${d.min} responses yet.</p>`;

  render(`
  <div class="reveal"><h1 class="page">Programme view</h1><p class="lede">All teams across the cohort. Teams appear on the graph once they reach ${d.min} responses.</p></div>
  <div class="stats">
    <div class="stat"><b>${d.teams.length}</b><span>teams created</span></div>
    <div class="stat"><b>${unlocked.length}</b><span>teams with results</span></div>
    <div class="stat"><b>${totalResp}</b><span>responses</span></div>
  </div>
  <section class="panel">
    <h2>Teams by zone</h2>
    <p class="small muted">Learning ${counts.learning}, comfort ${counts.comfort}, anxiety ${counts.anxiety}, apathy ${counts.apathy}.</p>
    <label class="toggle"><input type="checkbox" id="lbls"> Show team names</label>
    <div class="chart" id="achart"></div>
    ${legend([["w2", "W2 team"], ["w3", "W3 team"], ["avg", "Cohort average"]])}
  </section>
  <section class="panel">
    <h2>Cohort, statement by statement</h2>
    <p class="small muted">Averages across all responses from teams with results (${d.cohortN} responses).</p>
    ${cohortBars}
  </section>
  <section class="panel">
    <h2>All teams</h2>
    <div class="tablewrap"><table class="teams">
      <thead><tr><th>Team</th><th>Level</th><th>Responses</th><th>Safety</th><th>Influence</th><th>Standards</th><th>Zone</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="8" class="muted">No teams yet. Share the start page with leaders to begin.</td></tr>`}</tbody>
    </table></div>
    <div class="actions"><button class="btn small secondary" id="csv">Download summary (CSV)</button><button class="btn small secondary" id="reload">Refresh</button></div>
  </section>`);
  const draw = () => {
    $("#achart").innerHTML = chart(Object.assign({}, EDM, {
      teams: unlocked.map(t => ({ x: t.averages.accountability, y: t.averages.safety, level: t.level, label: t.name })),
      showLabels: $("#lbls").checked,
      avg: d.cohort ? { x: d.cohort.accountability, y: d.cohort.safety } : null,
      avgColor: "var(--learning)", aria: "All teams on the zones graph"
    }));
  };
  $("#lbls").addEventListener("change", draw);
  draw();
  bindCopies();
  $("#reload").addEventListener("click", () => loadAdmin());
  $("#csv").addEventListener("click", () => {
    const head = ["team", "level", "responses", "safety", "influence", "standards", "zone", "pred_safety", "pred_influence", "pred_standards"];
    const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    const lines = [head.join(",")].concat(d.teams.map(t => {
      const av = t.averages;
      return [t.name, t.level, t.n, av && av.safety, av && av.power, av && av.accountability,
        av ? ZONES[zoneOf(av.safety, av.accountability)].name : "", t.prediction && t.prediction.safety, t.prediction && t.prediction.power, t.prediction && t.prediction.accountability].map(q).join(",");
    }));
    const url = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
    const aEl = document.createElement("a"); aEl.href = url; aEl.download = "in-the-zone-summary.csv";
    document.body.appendChild(aEl); aEl.click(); aEl.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
  return true;
}

/* ---------- boot ---------- */
$("#partner").textContent = CONFIG.PARTNER;
if (DEMO) {
  $("#demo").innerHTML = `<div class="demo">Demo mode: nothing is saved. Try
    <button data-go="">Start page</button><button data-go="t=DEMO01">Team survey</button><button data-go="t=DEMO01&k=demo">Results</button><button data-go="t=DEMO03&k=demo3">Locked results</button><button data-go="admin=1">Programme view</button></div>`;
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.getAttribute("data-go"))));
}
route();
</script>
